include ':app'

def localProperties = new Properties()
def localPropertiesFile = new File(rootProject.projectDir, "local.properties")
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader('UTF-8') { reader ->
        localProperties.load(reader)
    }
}

def flutterSdkPath = localProperties.getProperty('flutter.sdk')
if (flutterSdkPath == null) {
    flutterSdkPath = System.getenv('FLUTTER_ROOT')
}
if (flutterSdkPath == null) {
    // Fallback default path for typical Linux runners if variable isn't active
    flutterSdkPath = "/opt/hostedtoolcache/flutter/stable-linux"
}

// Evaluate the local Flutter tools script directly
apply from: "$flutterSdkPath/packages/flutter_tools/gradle/app_plugin_loader.gradle"
