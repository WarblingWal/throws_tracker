name: Flutter Production Android Release Compilation Pipeline

on:
  push:
    branches:
      - main

jobs:
  compile-release-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Server Code Repository Branch
        uses: actions/checkout@v4

      - name: Install Stable Java Development Kit
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Initialise Clean Flutter Framework SDK Instance
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: false

      - name: Hard Overwrite Faulty Android Manifest
        run: |
          cat << 'EOF' > android/app/src/main/AndroidManifest.xml
          <manifest xmlns:android="http://android.com"
              package="com.example.throws_tracker">

              <uses-permission android:name="android.permission.INTERNET" />

              <application
                  android:label="Throws Hub Force"
                  android:icon="@mipmap/ic_launcher">
                  
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:launchMode="singleTop"
                      android:theme="@style/LaunchTheme"
                      android:configChanges="orientation|keyboardHidden|keyboard|screenSize|smallestScreenSize|locale|layoutDirection|fontScale|screenLayout|density|uiMode"
                      android:hardwareAccelerated="true"
                      android:windowSoftInputMode="adjustResize">
                      
                      <meta-data
                          android:name="io.flutter.embedding.android.NormalTheme"
                          **android:resource="@style/NormalTheme"** />
                        
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
                  
                  <meta-data
                      android:name="flutterEmbedding"
                      android:value="2" />
              </application>

              <queries>
                  <intent>
                      <action android:name="android.intent.action.PROCESS_TEXT"/>
                      <data android:mimeType="text/plain"/>
                  </intent>
              </queries>
          </manifest>
          EOF

      - name: Patch Gradle Properties for AGP 9 Backward Compatibility
        run: |
          mkdir -p android
          touch android/gradle.properties
          echo "android.newDsl=false" >> android/gradle.properties

      - name: Synchronize Package Dependencies
        run: flutter pub get

      - name: Self-Heal and Generate Missing Gradle Wrapper Files
        run: |
          cd android
          if [ ! -f gradlew ]; then
            echo "⚠️ gradlew file was missing from repository source. Initialising wrapper binaries..."
            gradle wrapper --gradle-version 8.14.0 --distribution-type bin
          else
            ./gradlew :wrapper --gradle-version 8.14.0 --distribution-type bin
          fi
          chmod +x gradlew

      - name: Compile Production Release Binary Package Artifact
        run: flutter build apk --release --android-skip-build-dependency-validation --no-tree-shake-icons

      - name: Export Deployable Release APK File to Dashboard
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: build/app/outputs/flutter-apk/app-release.apk
