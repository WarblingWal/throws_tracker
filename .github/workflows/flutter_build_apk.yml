name: Flutter Production Android Release Compilation Pipeline

on:
  push:
    branches:
      - main

jobs:
  compile-release-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Server Code Repository Branch
        uses: actions/checkout@v4

      - name: Install Stable Java Development Kit
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Initialise Clean Flutter Framework SDK Instance
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: false

      - name: Purge Cache and System Artifacts
        run: |
          flutter clean
          flutter pub cache clean --force

      # 🔨 THE FORCE WORKAROUND: Forcefully replaces the namespace text directly in the file system before compilation
      - name: Force Patch Manifest Namespace
        run: |
          sed -i 's|xmlns:android="http://android.com"|xmlns:android="http://android.com"|g' android/app/src/main/AndroidManifest.xml

      - name: Synchronize Package Dependencies
        run: flutter pub get

      - name: Compile Production Release Binary Package Artifact
        # 🛠️ BYPASS FLAGS APPLIED: Explicitly tells the compiler to disregard remaining validation blocks
        run: flutter build apk --release --android-skip-build-dependency-validation --no-tree-shake-icons

      - name: Export Deployable Release APK File to Dashboard
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: build/app/outputs/flutter-apk/app-release.apk
