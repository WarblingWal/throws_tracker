name: Flutter Automated Build Pipeline

on:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Compile Android Release APK
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository source code
        uses: actions/checkout@v4

      - name: Initialise Java Environment Matrix
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Initialise Stable Flutter SDK Framework
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Fetch Manifest Remote Dependencies
        run: flutter pub get

      - name: Compile Production Release Binary
        run: flutter build apk --release --no-tree-shake-icons
