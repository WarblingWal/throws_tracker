name: Flutter Production Android Release Compilation Pipeline

on:
  push:
    branches:
      - main

jobs:
  compile-release-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Server Code Repository Branch
        uses: actions/checkout@v4

      - name: Install Stable Java Development Kit
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Initialise Clean Flutter Framework SDK Instance
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: false # 👈 CRITICAL FIX: Disables the cache fallback system completely

      - name: Synchronize Package Dependencies
        run: flutter pub get

      - name: Compile Production Release Binary Package Artifact
        run: flutter build apk --release

      - name: Export Deployable Release APK File to Dashboard
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: build/app/outputs/flutter-apk/app-release.apk
