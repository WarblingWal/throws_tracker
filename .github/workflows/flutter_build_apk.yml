name: Flutter Build APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository Code
        uses: actions/checkout@v4

      - name: Setup Java Environment
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter Framework Engine
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'
          channel: 'stable'
          cache: true

      - name: Synchronize Package Dependencies
        run: flutter pub get

      # 🛡️ BRUTE-FORCE MANIFEST SANITIZER:
      # This step hunts down EVERY manifest in the workspace (including dependencies)
      # and enforces the exact, non-truncated Android XML schema namespace.
      - name: Sanitize All Workspace Android Manifest Namespaces
        run: |
          find . -name "AndroidManifest.xml" -type f -exec sed -i 's|xmlns:android="http://android.com"|xmlns:android="http://android.com"|g' {} +
          find . -name "AndroidManifest.xml" -type f -exec sed -i 's|xmlns:android="http://android.com"|xmlns:android="http://android.com"|g' {} +

       Kakao Build Task Execution
      - name: Compile Production Release APK with Toolchain Environment Overrides
        run: flutter build apk --release --no-tree-shake-icons --android-skip-build-dependency-validation
        env:
          GRADLE_OPTS: "-Dandroid.newDsl=false -Dandroid.suppressUnsupportedCompileSdk=true"

      - name: Publish Compiled APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ThrowsHubPro-Release-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
