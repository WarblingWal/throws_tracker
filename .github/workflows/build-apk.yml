name: Flutter Build APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository Code
        uses: actions/checkout@v4

      - name: Setup Java Environment
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter Framework Engine
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'
          channel: 'stable'
          cache: true

      - name: Synchronize Package Dependencies
        run: flutter pub get

      - name: Compile Production Release APK with AGP9 Override
        run: flutter build apk --release --dart-define=android.newDsl=false --extra-front-end-options=--Explicit-AGP-Bypass
        env:
          GRADLE_OPTS: "-Dandroid.newDsl=false"
