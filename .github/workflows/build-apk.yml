name: Flutter Build APK

on:
  push:
    branches:
      - main # Triggers the build whenever you push changes to the main branch
  workflow_dispatch: # Allows you to trigger the build manually from GitHub

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository Code
        uses: actions/checkout@v4

      - name: Setup Java Environment
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter Framework Engine
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'
          channel: 'stable'
          cache: true

      - name: Synchronize Package Dependencies
        run: flutter pub get

      - name: Compile Production Release APK
        run: flutter build apk --release

      - name: Upload Finished App Package
        uses: actions/upload-artifact@v4
        with:
          name: ThrowsHubPro-Release-APK
          path: build/app/outputs/flutter-apk/app-release.apk
